yaml
name: Atualizar Playlist TPA

on:
  schedule:
    # Corre automaticamente a cada 45 minutos
    - cron: '*/45 * * * *'
  workflow_dispatch: # Permite-te carregar num botão para atualizar manualmente sempre que quiseres

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descarregar código do repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Instalar dependências
      run: pip install requests

    - name: Executar o Script de captura de Tokens
      run: python atualizar.py

    - name: Guardar e Publicar a nova Playlist
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add playlist.m3u
        git commit -m "Playlist TPA Atualizada [Automático]" || exit 0
        git push
